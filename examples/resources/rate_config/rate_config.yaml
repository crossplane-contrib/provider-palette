apiVersion: rate.palette.crossplane.io/v1alpha1
kind: Config
metadata:
  name: tenant-rate-config
  annotations:
    description: "Tenant-level cloud rate config used to estimate cluster cloud and usage cost"
    # The rate config is a tenant-level singleton that always exists, so the
    # provider pins its external name to "default-rate-config-id" -- there is no
    # need to set crossplane.io/external-name. Applying this manifest adopts and
    # updates the tenant's existing config; deleting it restores Palette defaults.
  labels:
    app: rate-config
    environment: production
spec:
  deletionPolicy: Delete
  forProvider:
    # Public clouds take rate proportions: each pair must add up to 100.
    aws:
      - computeOptimized:
          - computeRateProportion: 70
            memoryRateProportion: 30
        memoryOptimized:
          - computeRateProportion: 30
            memoryRateProportion: 70
    azure:
      - computeOptimized:
          - computeRateProportion: 65
            memoryRateProportion: 35
        memoryOptimized:
          - computeRateProportion: 35
            memoryRateProportion: 65

    # Private clouds take unit prices in US dollars.
    vsphere:
      - cpuUnitPricePerHour: 0.015
        memoryUnitPriceGibPerHour: 0.008
        storageUnitPriceGibPerHour: 0.0002
        gpuUnitPricePerHour: 0.5

    # Unit prices for a custom cloud already registered in the tenant.
    # custom:
    #   - cloudType: nutanix
    #     rateConfig:
    #       - cpuUnitPricePerHour: 0.02
    #         memoryUnitPriceGibPerHour: 0.01
    #         storageUnitPriceGibPerHour: 0.0003
    #         gpuUnitPricePerHour: 0.6

  # Provider configuration reference
  providerConfigRef:
    name: default
