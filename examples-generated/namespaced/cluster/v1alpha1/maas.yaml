apiVersion: cluster.palette.m.crossplane.io/v1alpha1
kind: Maas
metadata:
  annotations:
    meta.upbound.io/example-id: cluster/v1alpha1/maas
  labels:
    testing.upbound.io/example-name: cluster
  name: cluster
  namespace: upbound-system
spec:
  forProvider:
    backupPolicy:
    - backupLocationIdSelector:
        matchLabels:
          testing.upbound.io/example-name: spectrocloud_backup_storage_location
      expiryInHour: 7200
      includeClusterResources: true
      includeDisks: true
      prefix: prod-backup
      schedule: 0 0 * * SUN
    cloudAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: spectrocloud_cloudaccount_maas
    cloudConfig:
    - domain: maas.mycompany.com
      enableLxdVm: false
      ntpServers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - time.google.com
      sshKeys: ${var.cluster_ssh_public_keys}
    clusterProfile:
    - idSelector:
        matchLabels:
          testing.upbound.io/example-name: spectrocloud_cluster_profile
    machinePool:
    - controlPlane: true
      count: 1
      instanceType:
      - minCpu: 8
        minMemoryMb: 16000
      name: control-plane
      placement:
      - resourcePool: Production-Compute-Pool-1
    - count: 1
      instanceType:
      - minCpu: 8
        minMemoryMb: 32000
      name: worker-basic
      overrideHealthCheckConfiguration: |
        maxUnhealthy: 40%
        nodeStartupTimeout: 10m
        unhealthyConditions:
          - type: Ready
            status: "False"
            timeout: 5m
          - type: Ready
            status: "Unknown"
            timeout: 5m
      placement:
      - resourcePool: Production-Compute-Pool-2
    name: ${var.cluster_name}
    scanPolicy:
    - configurationScanSchedule: 0 0 * * SUN
      conformanceScanSchedule: 0 0 1 * *
      penetrationScanSchedule: 0 0 * * SUN
    tags:
    - dev
    - department:devops
    - owner:bob
